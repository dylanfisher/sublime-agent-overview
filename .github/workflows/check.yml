name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv reads .python-version and installs that Python itself — the version is
      # never repeated here.
      - uses: astral-sh/setup-uv@v6

      - run: ./scripts/setup
      - run: ./scripts/check
