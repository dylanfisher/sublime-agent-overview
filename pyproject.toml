[project]
name = "sublime-agent"
version = "0.1.0"
description = "Live activity from AI coding agents in Sublime Text 4."
requires-python = ">=3.8,<3.9"
dependencies = []

[dependency-groups]
dev = ["basedpyright", "pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py38"
line-length = 100
extend-include = ["scripts/arch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.8"
typeCheckingMode = "strict"
include = ["sublime_agent.py", "core", "agents", "tests"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
